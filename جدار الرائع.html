<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>ملتقى النخبة - تخطيط 80%</title>
    <style>
        /* نفس كود التصميم الدقيق السابق */
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap' );
        :root {
            --bg-primary: #0a0806;
            --bg-secondary: #120e0a;
            --bg-tertiary: #1b140f;
            --bg-card: rgba(18, 14, 10, 0.95);
            
            --gold-primary: #d4af37;
            --gold-light: #ffdf7a;
            --gold-dark: #c59b27;
            --bronze-border: rgba(212, 175, 55, 0.3);
            
            --text-primary: #ffdf7a;
            --text-body: #e8e4dc;
            --text-muted: #a69580;
            
            --like-red: #8b0000;
            --button-black: rgba(10, 8, 6, 0.8);
            --send-blue: var(--gold-primary);
            --border-color: var(--bronze-border);
        }
        body {
            font-family: 'Tajawal', sans-serif; margin: 0; padding: 0;
            background: radial-gradient(circle at center, var(--bg-tertiary) 0%, var(--bg-primary) 100%);
            color: var(--text-body);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        
        *, *::before, *::after { box-sizing: border-box; }

        /* حركات الدخول الانسيابية */
        .fade-in-element {
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.5s ease-out, transform 0.5s ease-out;
        }
        .fade-in-element.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* الحاوية الرئيسية تأخذ 80% من الشاشة */
        .main-hub {
            width: 80%;
            height: 100%;
            display: flex;
            flex-direction: column;
            position: relative;
            border-left: 1px solid var(--border-color);
            box-shadow: -5px 0 15px rgba(0,0,0,0.5);
        }

        .side-panel {
            width: 20%;
            height: 100%;
            display: block;
            background: rgba(10, 8, 6, 0.6);
        }

        .youtube-panel {
            background-color: var(--bg-secondary);
            padding: 12px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            gap: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
            z-index: 10;
        }
        .youtube-panel input {
            flex-grow: 1;
            background: var(--bg-tertiary);
            color: var(--text-body);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 8px 12px;
            font-family: 'Tajawal', sans-serif;
            transition: all 0.3s;
        }
        .youtube-panel input:focus { border-color: var(--gold-primary); outline: none; box-shadow: 0 0 8px rgba(212, 175, 55, 0.3); }
        .youtube-panel button {
            background: linear-gradient(135deg, #1b1612, #100b08);
            color: var(--gold-primary);
            border: 1px solid var(--gold-primary);
            border-radius: 8px;
            padding: 0 20px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }
        .youtube-panel button:hover { background: var(--gold-primary); color: var(--bg-primary); box-shadow: 0 0 15px rgba(212, 175, 55, 0.4); }

        .wall-container {
            flex-grow: 1;
            overflow-y: auto;
            padding: 12px 8px 100px 8px;
        }

        /* --- نفس تصميم البطاقات الدقيق --- */
        .post-card {
            background: linear-gradient(135deg, #1b1612 0%, #100b08 100%);
            border: 1px solid var(--border-color);
            border-radius: 12px; margin-bottom: 15px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5); 
            position: relative; overflow: hidden;
            transition: border-color 0.3s;
        }
        .post-card:hover { border-color: rgba(212, 175, 55, 0.6); }
        .post-header, .post-content, .post-footer { position: relative; z-index: 1; }
        .post-header { display: flex; align-items: center; justify-content: space-between; padding: 12px 15px; }
        .user-info { display: flex; align-items: center; gap: 10px; }
        .user-info img { width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--gold-primary); }
        .decorated-name { background: rgba(212, 175, 55, 0.15); border: 1px solid var(--gold-primary); color: var(--gold-primary); padding: 4px 12px; border-radius: 16px; font-size: 14px; font-weight: bold; }
        .post-time { font-size: 11px; color: var(--text-muted); }
        .post-content { padding: 5px 15px 15px 15px; font-size: 15px; line-height: 1.6; font-weight: 500; color: var(--text-body); }
        .post-footer { display: flex; justify-content: space-between; align-items: center; padding: 0 15px 15px 15px; border-top: 1px solid rgba(255,255,255,0.05); margin-top: 10px; padding-top: 12px; }
        .actions { display: flex; gap: 8px; }
        .action-button { display: flex; align-items: center; justify-content: center; background-color: var(--button-black); border: 1px solid var(--border-color); color: var(--text-body); border-radius: 8px; padding: 6px 12px; font-size: 13px; font-weight: 500; cursor: pointer; transition: all 0.2s; }
        .action-button:hover { background: rgba(212, 175, 55, 0.15); color: var(--gold-light); border-color: var(--gold-primary); }
        .like-button { background-color: rgba(91, 29, 29, 0.6); border-color: #a63a3a; color: #ffdfdf; gap: 4px; }
        .like-button:hover { background-color: var(--like-red); border-color: #ff4d4d; color: white; box-shadow: 0 0 10px rgba(255, 26, 26, 0.4); }
        .delete-button { padding: 6px 10px; background: none; border: none; font-size: 14px; opacity: 0.6; }
        .delete-button:hover { opacity: 1; background: rgba(255,0,0,0.2); border: none; }

        /* --- الشريط السفلي --- */
        .bottom-bar {
            background-color: var(--bg-secondary); border-top: 1px solid var(--border-color);
            padding: 12px; z-index: 10;
        }
        .input-wrapper { display: flex; align-items: center; gap: 10px; }
        .input-wrapper input { flex-grow: 1; background-color: var(--bg-tertiary); border: 1px solid var(--border-color); border-radius: 20px; padding: 10px 15px; color: var(--text-body); font-size: 14px; font-family: 'Tajawal', sans-serif; transition: border-color 0.3s; }
        .input-wrapper input:focus { outline: none; border-color: var(--gold-primary); box-shadow: 0 0 10px rgba(212, 175, 55, 0.2); }
        .send-button { background: linear-gradient(180deg, var(--bg-tertiary), var(--bg-secondary)); border: 1px solid var(--gold-primary); border-radius: 50%; width: 45px; height: 45px; min-width: 45px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.3s; }
        .send-button svg { width: 22px; height: 22px; fill: var(--gold-primary); transform: scaleX(-1) translateX(-2px); transition: fill 0.3s; }
        .send-button:hover { background: var(--gold-primary); box-shadow: 0 0 15px rgba(212, 175, 55, 0.4); }
        .send-button:hover svg { fill: var(--bg-primary); }

        /* نافذة التعليقات (الدردشة المصغرة) */
        .comments-modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(0, 0, 0, 0.6);
            display: none;
            align-items: center; justify-content: center;
            z-index: 1000;
        }
        .comments-modal {
            background-color: var(--bg-primary); width: 90%; max-width: 500px;
            border: 1px solid var(--gold-primary); box-shadow: 0 0 25px rgba(0,0,0,0.8);
            border-radius: 12px; display: flex; flex-direction: column;
            height: 70%;
        }
        .comments-header { padding: 15px; font-weight: bold; border-bottom: 1px solid var(--border-color); color: var(--gold-light); }
        .comments-body { flex-grow: 1; padding: 15px; overflow-y: auto; color: var(--text-body); }
        .comment { margin-bottom: 12px; font-size: 14px; padding: 10px; background: var(--bg-tertiary); border-radius: 8px; border: 1px solid rgba(255,255,255,0.05); }
        .comment b { color: var(--gold-primary); display: block; margin-bottom: 4px; }
        .comments-footer { border-top: 1px solid var(--border-color); background: var(--bg-secondary); border-radius: 0 0 12px 12px; }

    </style>
</head>
<body>

    <div class="main-hub">
        <div class="youtube-panel">
            <input type="text" placeholder="ابحث في يوتيوب...">
            <button>بحث</button>
        </div>

        <div class="wall-container">
            <article class="post-card fade-in-element">
                <div class="post-header">
                    <div class="user-info">
                        <img src="https://i.pravatar.cc/100?u=king" alt="User">
                        <div class="decorated-name">👑 ...عــقــيــل</div>
                    </div>
                </div>
                <p class="post-content">تم ضبط التخطيط ليكون 80% للحائط.</p>
                <div class="post-footer">
                    <div class="actions">
                        <div class="action-button like-button">❤️ 0</div>
                        <div class="action-button comment-button" onclick="openComments( )">تعليق 0</div>
                    </div>
                    <div class="action-button delete-button">❌</div>
                </div>
            </article>
        </div>

        <div class="bottom-bar">
            <div class="input-wrapper">
                <input type="text" placeholder="أكتب رسالتك هنا...">
                <button class="send-button">
                    <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path></svg>
                </button>
            </div>
        </div>
    </div>

    <!-- اللوحة الجانبية الفارغة (20%) -->
    <div class="side-panel">
        <!-- هذه المساحة فارغة حاليًا كما طلبت -->
    </div>

    <!-- نافذة التعليقات (مخفية) -->
    <div class="comments-modal-overlay" id="comments-modal">
        <div class="comments-modal">
            <div class="comments-header">
                التعليقات
                <span style="float: left; cursor: pointer;" onclick="closeComments()">✖️</span>
            </div>
            <div class="comments-body">
                <div class="comment"><b>علي:</b> تعليق تجريبي أول.</div>
                <div class="comment"><b>سارة:</b> رائع!</div>
            </div>
            <div class="comments-footer">
                <div class="input-wrapper" style="padding: 8px;">
                    <input type="text" placeholder="أضف تعليقًا...">
                    <button class="send-button">
                        <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path></svg>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // نظام نافذة التعليقات
        const commentsModal = document.getElementById('comments-modal');
        function openComments() { commentsModal.style.display = 'flex'; }
        function closeComments() { commentsModal.style.display = 'none'; }
        commentsModal.addEventListener('click', function(event) {
            if (event.target === commentsModal) { closeComments(); }
        });

        // نظام حركات الدخول الانسيابية (Animations)
        const observerOptions = {
            root: null,
            rootMargin: '0px',
            threshold: 0.1
        };

        const observer = new IntersectionObserver((entries, observer) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('visible');
                    // بمجرد ظهورها، لا نلغي ظهورها لتبقى ثابتة
                    observer.unobserve(entry.target);
                }
            });
        }, observerOptions);

        // تفعيل المراقب على جميع المنشورات
        document.querySelectorAll('.fade-in-element').forEach(element => {
            observer.observe(element);
        });
    </script>

</body>
</html>
