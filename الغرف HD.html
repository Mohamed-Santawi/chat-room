<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>التحفة التي لا تموت</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap' );

        :root {
            --color-1: #0d6efd; --color-1-light: #e7f0ff;
            --color-2: #198754; --color-2-light: #e8f3ed;
            --color-3: #dc3545; --color-3-light: #fbebed;
            --color-4: #ffc107; --color-4-light: #fff8e6;
        }

        body {
            background-color: #e9ebee;
            font-family: 'Tajawal', sans-serif;
            margin: 0;
            overflow-x: hidden;
        }

        .open-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            background-color: var(--color-1);
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            z-index: 1001;
        }

        .room-list-panel {
            position: fixed;
            top: 0;
            right: -100%;
            width: 60%;
            max-width: 380px;
            min-width: 320px;
            height: 100%;
            background-color: #fff;
            box-shadow: -2px 0 10px rgba(0, 0, 0, 0.2);
            display: flex;
            flex-direction: column;
            transition: right 0.4s ease-in-out;
            z-index: 1000;
        }

        .room-list-panel.open { right: 0; }
        
        .panel-header {
            padding: 0;
            display: flex;
            align-items: center;
            flex-shrink: 0;
            background-color: #000;
            position: relative;
            height: 75px;
            overflow: hidden;
        }

        #header-video {
            position: absolute;
            top: 50%;
            left: 50%;
            min-width: 100%;
            min-height: 100%;
            object-fit: cover;
            transform: translate(-50%, -50%);
            opacity: 0.6;
            z-index: 1;
        }

        .header-content {
            position: relative;
            z-index: 2;
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            padding: 0 15px;
            color: white;
            text-shadow: 0 2px 4px rgba(0,0,0,0.7);
        }

        .close-panel-btn { font-size: 26px; cursor: pointer; }
        .panel-title { font-weight: bold; font-size: 20px; }

        .new-room-header {
            padding: 10px;
            background-color: #fff;
            border-bottom: 1px solid #f0f0f0;
            display: flex;
            justify-content: space-around; /* توزيع العناصر بشكل متساوي */
            align-items: center;
            flex-shrink: 0;
        }
        
        .header-gif {
            width: 40px;
            height: 40px;
        }

        .new-room-btn {
            background-color: var(--color-2);
            color: white;
            border: none;
            border-radius: 20px;
            padding: 8px 20px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
        }
        .new-room-btn i { margin-left: 8px; font-size: 18px; }

        .room-list {
            list-style: none;
            padding: 8px;
            margin: 0;
            flex-grow: 1;
            overflow-y: auto;
            background-image: url('https://www.transparenttextures.com/patterns/az-subtle.png' );
            background-color: #fdfdfd;
        }

        .room-item {
            display: flex;
            align-items: center;
            padding: 8px 10px;
            margin-bottom: 8px;
            border-radius: 12px;
            background: linear-gradient(to left, var(--bg-color, #fff), #fff 90%);
            box-shadow: 0 0 8px 2px var(--glow-color, rgba(0,0,0,0.15));
            transition: all 0.3s ease;
        }
        
        .room-item:hover {
            box-shadow: 0 0 16px 4px var(--glow-color, rgba(0,0,0,0.25));
            transform: translateY(-3px);
        }
        
        .room-item.color-1 { --glow-color: var(--color-1); --bg-color: var(--color-1-light); }
        .room-item.color-2 { --glow-color: var(--color-2); --bg-color: var(--color-2-light); }
        .room-item.color-3 { --glow-color: var(--color-3); --bg-color: var(--color-3-light); }
        .room-item.color-4 { --glow-color: var(--color-4); --bg-color: var(--color-4-light); }

        .room-avatar {
            width: 38px;
            height: 38px;
            border-radius: 6px;
            object-fit: cover;
            margin-left: 12px;
            flex-shrink: 0;
        }

        .room-info {
            flex-grow: 1;
            overflow: hidden;
            padding-right: 5px;
        }
        .room-name { font-size: 15px; font-weight: 500; color: #222; }
        .lock-icon-svg { width: 12px; height: 12px; margin-left: 5px; fill: var(--color-4); }
        .room-description { font-size: 13px; color: #888; margin-top: 1px; }

        .room-stats {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            /* اللون البنفسجي الجميل الذي طلبته */
            background: linear-gradient(to top, #e9e4f0, #f4f2f7);
            border: 1px solid #d8d2de;
            border-radius: 8px;
            padding: 4px 6px;
            min-width: 55px;
            margin-right: 10px;
        }

        .user-count { color: #333; font-size: 12px; font-weight: bold; }
        .user-count i { margin-right: 4px; font-size: 13px; color: #555; }
        .mic-icon { color: #8a8a8a; font-size: 15px; margin-top: 3px; }

    </style>
</head>
<body>

    <button class="open-btn" onclick="togglePanel()">افتح التحفة التي لا تموت</button>

    <div class="room-list-panel" id="roomPanel">
        <div class="panel-header">
            <video id="header-video" autoplay loop muted playsinline>
                <source src="https://assets.codepen.io/6093409/river.mp4" type="video/mp4">
            </video>
            <div class="header-content">
                <span class="panel-title">الغرف</span>
                <span class="close-panel-btn" onclick="togglePanel( )">×</span>
            </div>
        </div>
        <div class="new-room-header">
            <!-- إضافة الصور المتحركة هنا -->
            <img src="https://i.gifer.com/origin/a2/a2051422d250328699153164937c5a93_w200.gif" alt="Lion" class="header-gif">
            <button class="new-room-btn"><i class="fa-solid fa-plus"></i>غرفه جديده</button>
            <img src="https://i.gifer.com/or/75/7595b2c325f40929137dbf2735a9f68e.gif" alt="Bear" class="header-gif">
        </div>
        <ul class="room-list">
            
            <li class="room-item color-1">
                <img src="https://i.imgur.com/v8S7z25.png" alt="Avatar" class="room-avatar">
                <div class="room-info"><div class="room-name">اهل البصرة // ROOM</div></div>
                <div class="room-stats">
                    <div class="user-count"><i class="fa-solid fa-user-group"></i>4/20</div>
                    <i class="fa-solid fa-microphone-slash mic-icon"></i>
                </div>
            </li>

            <li class="room-item color-2">
                <img src="https://i.imgur.com/O3Gq2pD.jpeg" alt="Avatar" class="room-avatar">
                <div class="room-info"><div class="room-name">الأهواز Room</div></div>
                <div class="room-stats">
                    <div class="user-count"><i class="fa-solid fa-user-group"></i>4/50</div>
                    <i class="fa-solid fa-microphone-slash mic-icon"></i>
                </div>
            </li>

            <li class="room-item color-3">
                <img src="https://i.imgur.com/tZ2x1hX.png" alt="Avatar" class="room-avatar">
                <div class="room-info">
                    <div class="room-name">✝ المسيحيين // ROOM</div>
                    <div class="room-description">اهلا وسهلا بروم</div>
                </div>
                <div class="room-stats">
                    <div class="user-count"><i class="fa-solid fa-user-group"></i>4/50</div>
                    <i class="fa-solid fa-microphone-slash mic-icon"></i>
                </div>
            </li>
            
            <li class="room-item color-4">
                <img src="https://i.imgur.com/pYxL2Q8.png" alt="Avatar" class="room-avatar">
                <div class="room-info">
                    <div class="room-name">
                        خدمات الزوار [ROOM]
                        <svg class="lock-icon-svg" viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zM9 6c0-1.66 1.34-3 3-3s3 1.34 3 3v2H9V6zm9 14H6V10h12v10zm-6-3c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2z"/></svg>
                    </div>
                </div>
                <div class="room-stats">
                    <div class="user-count"><i class="fa-solid fa-user-group"></i>1/20</div>
                    <i class="fa-solid fa-microphone-slash mic-icon"></i>
                </div>
            </li>
            
        </ul>
    </div>

    <script>
        function togglePanel( ) {
            const panel = document.getElementById('roomPanel');
            panel.classList.toggle('open');
        }
    </script>

</body>
</html>
