<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تسجيل الدخول - شات خان الذهب</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0806;
            --bg-secondary: #120e0a;
            --bg-tertiary: #1b140f;
            --bg-card: rgba(18, 14, 10, 0.85);
            
            --gold-primary: #d4af37;
            --gold-light: #ffdf7a;
            --gold-dark: #c59b27;
            --bronze-border: rgba(212, 175, 55, 0.4);
            
            --text-primary: #ffdf7a;
            --text-body: #e8e4dc;
            --text-muted: #a69580;
            
            --gradient-gold: linear-gradient(135deg, #d4af37 0%, #c59b27 100%);
            --gradient-dark: linear-gradient(135deg, #1b1612 0%, #100b08 100%);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Tajawal', sans-serif;
            transition: all 0.3s ease;
        }

        body {
            background: var(--bg-primary);
            background-image: radial-gradient(circle at top center, rgba(212, 175, 55, 0.15), transparent 50%),
                              radial-gradient(circle at bottom center, rgba(212, 175, 55, 0.1), transparent 50%);
            color: var(--text-body);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            padding-bottom: 50px;
        }

        /* --- Header --- */
        header {
            width: 100%;
            max-width: 500px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: rgba(10, 8, 6, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--bronze-border);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.1rem;
            font-weight: 800;
            color: var(--gold-light);
            text-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
        }

        .header-title i {
            font-size: 1.5rem;
            color: var(--gold-primary);
        }

        .refresh-btn {
            background: var(--gradient-dark);
            border: 1px solid var(--gold-primary);
            color: var(--gold-primary);
            width: 35px;
            height: 35px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.2);
        }

        .refresh-btn:hover {
            background: var(--gold-primary);
            color: var(--bg-primary);
            transform: rotate(180deg);
        }

        /* --- Main Container --- */
        .container {
            width: 100%;
            max-width: 500px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* --- Hero Banner --- */
        .hero-banner {
            background: var(--bg-card);
            border: 1px solid var(--bronze-border);
            border-radius: 20px;
            padding: 25px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5), inset 0 0 20px rgba(212, 175, 55, 0.05);
            position: relative;
            overflow: hidden;
        }

        .hero-banner::before {
            content: '';
            position: absolute;
            top: -50px; left: -50px; right: -50px; bottom: -50px;
            background: radial-gradient(circle at center, rgba(212, 175, 55, 0.1) 0%, transparent 60%);
            z-index: 0;
        }

        .avatar-container {
            position: relative;
            z-index: 1;
            margin-bottom: 15px;
        }

        .avatar-img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 3px solid var(--gold-primary);
            object-fit: cover;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.4);
        }

        .status-badge {
            position: absolute;
            bottom: 5px;
            right: 0;
            background: #28a745;
            color: white;
            font-size: 0.7rem;
            font-weight: bold;
            padding: 3px 8px;
            border-radius: 20px;
            border: 2px solid var(--bg-card);
            box-shadow: 0 0 10px rgba(40, 167, 69, 0.6);
        }

        .hero-title {
            font-size: 1.4rem;
            font-weight: 900;
            color: var(--gold-light);
            margin-bottom: 8px;
            z-index: 1;
        }

        .hero-subtitle {
            font-size: 0.95rem;
            color: var(--text-body);
            z-index: 1;
            line-height: 1.5;
        }

        /* --- Login Card --- */
        .login-card {
            background: var(--bg-card);
            border: 1px solid var(--bronze-border);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .tabs {
            display: flex;
            background: rgba(10, 8, 6, 0.6);
            border-bottom: 1px solid rgba(212, 175, 55, 0.15);
        }

        .tab {
            flex: 1;
            padding: 15px 0;
            text-align: center;
            font-weight: bold;
            font-size: 0.95rem;
            color: var(--text-muted);
            cursor: pointer;
            position: relative;
            background: transparent;
            border: none;
        }

        .tab.active {
            color: var(--gold-primary);
            background: rgba(212, 175, 55, 0.05);
        }

        .tab.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: var(--gold-primary);
            box-shadow: 0 -2px 10px rgba(212, 175, 55, 0.5);
        }

        .login-form {
            padding: 25px 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper i {
            position: absolute;
            right: 15px;
            color: var(--gold-primary);
            font-size: 1.2rem;
        }

        .custom-input {
            width: 100%;
            padding: 14px 45px 14px 15px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--bronze-border);
            border-radius: 50px;
            color: var(--text-body);
            font-size: 1rem;
            font-weight: 500;
        }

        .custom-input::placeholder {
            color: var(--text-muted);
        }

        .custom-input:focus {
            outline: none;
            border-color: var(--gold-primary);
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.2);
            background: rgba(212, 175, 55, 0.05);
        }

        .options-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            color: var(--text-muted);
            padding: 0 5px;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .remember-me input {
            accent-color: var(--gold-primary);
            width: 16px;
            height: 16px;
        }

        .forgot-password {
            color: var(--gold-primary);
            text-decoration: none;
            font-weight: bold;
        }

        .submit-btn {
            background: var(--gradient-gold);
            color: #0a0806;
            border: none;
            padding: 15px;
            border-radius: 50px;
            font-size: 1.2rem;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(212, 175, 55, 0.4);
            margin-top: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(212, 175, 55, 0.6);
        }

        /* --- Online Users Section --- */
        .section-header {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.1rem;
            font-weight: 800;
            color: var(--gold-light);
            margin-top: 15px;
            margin-bottom: 5px;
            padding: 0 10px;
        }

        .online-count-badge {
            background: var(--gradient-dark);
            border: 1px solid var(--gold-primary);
            color: var(--gold-primary);
            padding: 3px 12px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: bold;
        }

        .users-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .user-card {
            background: var(--gradient-dark);
            border: 1px solid var(--bronze-border);
            border-radius: 15px;
            padding: 12px 15px;
            display: flex;
            align-items: center;
            gap: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            position: relative;
        }

        .user-card:hover {
            border-color: var(--gold-primary);
            transform: translateX(-5px);
        }

        .user-avatar-wrapper {
            position: relative;
        }

        .user-avatar {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            border: 2px solid var(--gold-primary);
            object-fit: cover;
        }

        .user-info {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .user-name {
            font-weight: bold;
            font-size: 1rem;
            color: var(--gold-light);
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .stars {
            color: var(--gold-primary);
            font-size: 0.75rem;
        }

        .user-status {
            font-size: 0.8rem;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 180px;
        }

        .user-flag {
            font-size: 1.5rem;
        }

        .crown-icon {
            color: var(--gold-primary);
            font-size: 1.1rem;
        }

        /* --- Footer Ornament --- */
        .footer-ornament {
            margin-top: 40px;
            color: var(--gold-primary);
            font-size: 2rem;
            opacity: 0.5;
            text-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .footer-ornament::before,
        .footer-ornament::after {
            content: '';
            display: block;
            width: 80px;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--gold-primary), transparent);
        }

    </style>
</head>
<body>

    <header>
        <div class="header-title">
            <i class="bi bi-crown-fill"></i>
            شات خان الذهب الصوتي
        </div>
        <div class="refresh-btn" onclick="location.reload()">
            <i class="bi bi-arrow-clockwise"></i>
        </div>
    </header>

    <div class="container">
        
        <!-- Hero Banner -->
        <div class="hero-banner">
            <div class="avatar-container">
                <img src="https://i.pravatar.cc/200?img=47" alt="Welcome" class="avatar-img">
                <div class="status-badge">متصل</div>
            </div>
            <div class="hero-title">تعا الدنيا حسنة ...</div>
            <div class="hero-subtitle">أهلاً وسهلاً بكم في شات خان الذهب</div>
        </div>

        <!-- Login Card -->
        <div class="login-card">
            <div class="tabs">
                <button class="tab">تسجيل عضوية</button>
                <button class="tab active">دخول الأعضاء</button>
                <button class="tab">دخول الزوار</button>
            </div>
            <form class="login-form" onsubmit="event.preventDefault(); window.location.href='/chat';">
                <div class="input-wrapper">
                    <i class="bi bi-person-fill"></i>
                    <input type="text" class="custom-input" placeholder="اسم المستخدم" required>
                </div>
                <div class="input-wrapper">
                    <i class="bi bi-lock-fill"></i>
                    <input type="password" class="custom-input" placeholder="كلمة المرور" required>
                </div>
                
                <div class="options-row">
                    <label class="remember-me">
                        <input type="checkbox" checked>
                        تذكرني
                    </label>
                    <a href="#" class="forgot-password">نسيت كلمة المرور؟</a>
                </div>

                <button type="submit" class="submit-btn">
                    <i class="bi bi-box-arrow-in-left"></i>
                    دخول
                </button>
            </form>
        </div>

        <!-- Online Users -->
        <div class="section-header">
            <i class="bi bi-people-fill"></i>
            المتواجدون الآن
            <span class="online-count-badge">153</span>
        </div>

        <div class="users-list">
            <!-- User 1 -->
            <div class="user-card">
                <div class="user-avatar-wrapper">
                    <img src="https://i.pravatar.cc/150?img=11" alt="User 1" class="user-avatar">
                </div>
                <div class="user-info">
                    <div class="user-name">
                        <i class="bi bi-suit-spade-fill crown-icon"></i>
                        أمير الغرام
                        <span class="stars">⭐⭐⭐⭐⭐</span>
                    </div>
                    <div class="user-status">يا هلا بالجميع نورتونا...</div>
                </div>
                <div class="user-flag">🇸🇦</div>
            </div>

            <!-- User 2 -->
            <div class="user-card">
                <div class="user-avatar-wrapper">
                    <img src="https://i.pravatar.cc/150?img=5" alt="User 2" class="user-avatar">
                </div>
                <div class="user-info">
                    <div class="user-name">
                        <i class="bi bi-star-fill crown-icon"></i>
                        عطر الشام
                        <span class="stars">⭐⭐⭐⭐</span>
                    </div>
                    <div class="user-status">متصل الآن...</div>
                </div>
                <div class="user-flag">🇸🇾</div>
            </div>

            <!-- User 3 -->
            <div class="user-card">
                <div class="user-avatar-wrapper">
                    <img src="https://i.pravatar.cc/150?img=12" alt="User 3" class="user-avatar">
                </div>
                <div class="user-info">
                    <div class="user-name">
                        <i class="bi bi-heart-fill crown-icon" style="color: #ff4d4d;"></i>
                        مجهول الهوية
                        <span class="stars">⭐⭐⭐</span>
                    </div>
                    <div class="user-status">الصمت لغتي...</div>
                </div>
                <div class="user-flag">🇮🇶</div>
            </div>
        </div>

    </div>

    <!-- Footer Ornament -->
    <div class="footer-ornament">
        <i class="bi bi-gem"></i>
    </div>

    <script>
        // تفعيل التنقل بين التبويبات شكلياً
        const tabs = document.querySelectorAll('.tab');
        tabs.forEach(tab => {
            tab.addEventListener('click', () => {
                tabs.forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
            });
        });
    </script>
</body>
</html>
